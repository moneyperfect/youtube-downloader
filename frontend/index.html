<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 视频下载器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-shell">
        <header class="hero">
            <p class="hero-kicker">Studio Aureo</p>
            <h1>YOUTUBE 视频下载器</h1>
            <p class="hero-subtitle">文艺复兴工坊 · 将网络影像收进你的私人典藏</p>
            <div class="hero-divider" aria-hidden="true"></div>
            <div class="hero-badges" aria-hidden="true">
                <span class="hero-badge"><i>&#10022;</i> 工坊质感</span>
                <span class="hero-badge"><i>&#9883;</i> 稳定下载</span>
                <span class="hero-badge"><i>&#9672;</i> 本地归档</span>
            </div>
        </header>

        <main class="layout-grid">
            <section class="panel panel-form" aria-labelledby="formTitle">
                <h2 id="formTitle" class="panel-title">下载委托</h2>

                <label for="videoUrl" class="field-label">视频地址</label>
                <div class="field-row">
                    <textarea id="videoUrl" class="field-input field-textarea" rows="3"
                        placeholder="粘贴视频链接，支持批量（每行一个）&#10;例如：&#10;https://www.youtube.com/watch?v=xxx&#10;https://www.youtube.com/watch?v=yyy"></textarea>
                </div>

                <div class="field-row field-options">
                    <div class="field-group">
                        <label for="qualitySelect" class="field-label">画质选择</label>
                        <select id="qualitySelect" class="field-select">
                            <option value="1080p">1080p 高清</option>
                            <option value="720p">720p 标清</option>
                            <option value="480p">480p 流畅</option>
                            <option value="audio">仅音频</option>
                        </select>
                    </div>
                    <button id="downloadBtn" class="btn btn-crimson">开始下载</button>
                </div>
                <p class="field-hint">下载任务会自动使用预设网络通道，无需额外配置。</p>

                <div class="status-strip">
                    <div class="status-chip">
                        <span class="chip-icon">&#8987;</span>
                        <span id="globalProgressText">暂无活动下载</span>
                    </div>
                    <button id="enableNotifyBtn" class="mini-btn" type="button">启用完成通知</button>
                </div>
                <div class="global-progress" id="globalProgressTrack">
                    <div class="global-progress-fill" id="globalProgressFill"></div>
                </div>

                <!-- 设置面板 -->
                <details class="settings-panel">
                    <summary class="settings-toggle">设置</summary>
                    <div class="settings-body">
                        <div class="setting-item">
                            <label for="settingProxy" class="field-label">代理地址</label>
                            <input id="settingProxy" class="field-input field-input-sm" type="text"
                                placeholder="127.0.0.1:7897">
                        </div>
                        <div class="setting-item">
                            <label for="settingConcurrent" class="field-label">最大并发数</label>
                            <select id="settingConcurrent" class="field-select field-select-sm">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3" selected>3</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <button id="saveSettingsBtn" class="mini-btn" type="button">保存设置</button>
                    </div>
                </details>
            </section>

            <section class="panel panel-history" aria-labelledby="historyTitle">
                <div class="panel-head">
                    <h2 id="historyTitle" class="panel-title">历史下载记录</h2>
                    <span id="activeCount" class="active-count">0 个活动任务</span>
                </div>

                <!-- 搜索框 -->
                <div class="search-bar">
                    <input id="searchInput" class="field-input field-input-search" type="text"
                        placeholder="搜索历史记录...">
                </div>

                <div class="table-head">
                    <span class="th-name"><i>&#127916;</i> 视频标题</span>
                    <span class="th-size"><i>&#128230;</i> 文件大小</span>
                    <span class="th-status"><i>&#9203;</i> 状态</span>
                    <span class="th-actions"><i>&#127932;</i> 操作</span>
                </div>

                <div class="download-list" id="downloadList">
                    <div class="empty-state" id="emptyState">暂无下载记录，输入链接开始第一条任务。</div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <span>All Rights Reserved</span>
        </footer>
    </div>

    <!-- 密码认证弹窗 -->
    <div class="auth-overlay" id="authOverlay" style="display:none">
        <div class="auth-dialog">
            <h3>需要密码认证</h3>
            <input id="authPassword" class="field-input" type="password" placeholder="请输入访问密码">
            <button id="authSubmitBtn" class="btn btn-crimson">确认</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
</body>

</html>
